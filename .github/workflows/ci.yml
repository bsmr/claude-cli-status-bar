name: ci

# Runs on every push to a working branch and on every PR targeting main.
# Gates: gofmt cleanliness, go vet, staticcheck, module tidiness, the test
# suite with race + cover, and a cross-compile matrix so the windows/darwin
# build tags are exercised before goreleaser hits them at tag time.
# Matches the local "Develop" block in the README.
#
# The branch list mirrors the project's branch model, not just its release
# branches. Work lands from `fix-*`, `hotfix-*` and `feature-*` as well as
# `development-*`, and it lands by CLI merge rather than by pull request —
# so the `pull_request` trigger below never fires for it. Until 0.4.20 those
# three prefixes were missing here, and their commits first met CI *after*
# they were already on main.
#
# `production-*` is deliberately absent: it is created from main after the
# merge, so its content has already been through this workflow.
on:
  push:
    branches:
      - main
      - 'development-**'
      - 'fix-**'
      - 'hotfix-**'
      - 'feature-**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found files needing formatting:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Tidiness is gated HERE so it cannot surface at tag time. The release
      # job runs the same check as a goreleaser `before` hook, and a hook
      # failure aborts a release whose tag is already public — the one moment
      # it is most expensive to learn. `-diff` reports without writing, so
      # this step can never leave the tree modified.
      - name: go mod tidy
        run: go mod tidy -diff

      # Run from the module cache without adding a tool dependency to
      # go.mod: `go run pkg@version` is module-aware but leaves the
      # current module's go.mod/go.sum untouched. The version is pinned
      # for reproducibility — with `@latest` a new staticcheck release
      # can red the pipeline on an untouched tree. No config file — the
      # default check set is deliberately all this project gates on.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: go test
        run: go test -race -cover ./...

  # Compilation only, no tests: enough to catch build-tag and stub
  # signature drift in the //go:build windows path (which the host-only
  # test job never compiles) before goreleaser cross-builds at tag time.
  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: go build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

      - name: go vet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...
