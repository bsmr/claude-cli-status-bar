name: release

# Triggered by v*.*.* tags pushed to the `github` remote (renamed from
# `github-origin` on 2026-07-28). The user pushes tags deliberately as part
# of the release-workflow Gate 3, so a successful tag-to-Release pipeline
# ride here is the expected completion of every patch ship.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GoReleaser needs the full git history to derive the
          # changelog since the previous tag.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # The GoReleaser version is pinned for the same reason ci.yml pins
      # staticcheck: with `latest`, an upstream release can break this
      # workflow on an untouched tree. That matters more here than in CI —
      # this job only ever runs on a tag push, so a breakage surfaces at the
      # one moment the tag is already public and the release is expected.
      # Bump deliberately, and run `goreleaser check` against the new version
      # before doing so.
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
