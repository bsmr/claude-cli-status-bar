# GoReleaser config for ccsb cross-platform releases.
#
# Triggered by .github/workflows/release.yml on every v*.*.* tag push.
# Produces tarballs/zips per OS+ARCH, a checksums file, and a GitHub
# Release with auto-generated notes drawn from the commits since the
# previous tag.
#
# Local validation — no install needed, and this pins the same version
# .github/workflows/release.yml runs, so a local pass means the tag push
# will pass too:
#   go run github.com/goreleaser/goreleaser/v2@v2.17.1 check
#   go run github.com/goreleaser/goreleaser/v2@v2.17.1 release --snapshot --clean --skip=publish
# Output lands in ./dist (gitignored). Keep the version here in step with
# release.yml.
version: 2

before:
  hooks:
    # `-diff` reports and fails; the bare `go mod tidy` this replaces would
    # REWRITE go.mod/go.sum in the release checkout, so a release could be
    # built from a different dependency set than the one CI tested — and
    # silently, since a tidy that changes something says nothing. It is also
    # the suspected cause of v0.4.7 shipping as `+dirty`. ci.yml runs the
    # same check on every push, so an untidy tree is caught long before a
    # tag makes this hook the messenger.
    - go mod tidy -diff

builds:
  - id: ccsb
    main: ./cmd/ccsb
    binary: ccsb
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on ARM64 is unusual for terminal tooling; skip until
      # there is concrete demand.
      - goos: windows
        goarch: arm64
    # -buildvcs=false is load-bearing, not cosmetic. GoReleaser builds
    # inside a full git checkout, so the toolchain would stamp vcs.revision
    # into the release binaries — and ccsb's self-update guard reads exactly
    # that setting as "this is a local build, refuse to overwrite it". With
    # VCS stamping left on, every release user is refused an update and sees
    # ⊘ instead of ↑. vcs.revision must mean "local build" and nothing else.
    #
    # Dropping the VCS info also drops the version ReadBuildInfo() derived
    # from it (and the `+dirty` suffix the `go mod tidy` hook above provoked,
    # which render.ParseSemver cannot parse), so the version is injected
    # explicitly instead. internal/pkg/cli.Version prefers this ldflag over
    # ReadBuildInfo().
    ldflags:
      - -s -w -X go.muehmer.eu/claude-cli-status-bar/internal/pkg/cli.Version={{ .Version }}
    flags:
      - -trimpath
      - -buildvcs=false

archives:
  - id: ccsb
    name_template: >-
      ccsb_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/configuration.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

release:
  github:
    owner: bsmr
    name: claude-cli-status-bar
  prerelease: auto
  draft: false
  header: |
    ## Install

    Download the archive for your OS/arch from the assets below, extract
    `ccsb`, place it on `$PATH`, then run `ccsb install` to hook it into
    Claude Code's `~/.claude/settings.json`.

    ## Updating

    From 0.4.8 on, `ccsb update` replaces the running binary in place —
    via `go install` when ccsb lives in `GOBIN`, otherwise by downloading
    the archive above and verifying it against `checksums.txt`.

    **Upgrading from 0.4.7 or earlier requires a manual download.** Those
    builds were stamped with VCS metadata that made them indistinguishable
    from a local `go build`, which `ccsb update` refuses to overwrite — so
    they cannot update themselves to this release. Replace the binary once
    by hand and `ccsb update` works from then on. The same metadata made
    0.4.7 report its version as `0.4.7+dirty`, which disabled its
    update-available indicator; that is fixed here too.

    See the [README](README.md) for the full subcommand surface and
    [docs/configuration.md](docs/configuration.md) for the renderer
    schema.
  footer: |
    ---
    Built from `go.muehmer.eu/claude-cli-status-bar` — the module path
    resolves through a vanity URL pointing at this repository.

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^Merge'
      - '^chore:'
      - 'Co-Authored-By:'
